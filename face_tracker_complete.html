<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Realistische Hut-Platzierung mit MediaPipe</title>
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            font-family: 'Arial', sans-serif;
            color: white;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        .header h1 {
            margin: 0;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .header p {
            margin: 10px 0;
            font-size: 1.1em;
            opacity: 0.9;
        }

        .camera-container {
            position: relative;
            width: 640px;
            height: 480px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            border-radius: 15px;
            overflow: hidden;
            background: #000;
            border: 3px solid rgba(255, 255, 255, 0.2);
        }

        #video {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none; /* Video wird versteckt, nur Canvas wird angezeigt */
        }

        #canvas {
            position: absolute;
            width: 100%;
            height: 100%;
            transform: scaleX(-1); /* Gespiegelt für natürliche Selfie-Ansicht */
        }

        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: white;
            font-size: 1.2em;
            z-index: 10;
        }

        .loading.hidden {
            display: none;
        }

        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top: 4px solid #fff;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .controls {
            margin-top: 20px;
            text-align: center;
        }        .status {
            background: rgba(0, 0, 0, 0.5);
            padding: 10px 20px;
            border-radius: 25px;
            font-size: 0.9em;
            margin-top: 15px;
        }

        .filter-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-bottom: 15px;
        }

        .filter-btn {
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.3);
            color: white;
            padding: 10px 20px;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 1em;
            font-weight: bold;
        }

        .filter-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            border-color: rgba(255, 255, 255, 0.5);
            transform: translateY(-2px);
        }

        .filter-btn.active {
            background: rgba(255, 255, 255, 0.9);
            color: #667eea;
            border-color: white;
        }

        @media (max-width: 700px) {
            .camera-container {
                width: 90vw;
                height: calc(90vw * 0.75);
            }
        }
    </style>
</head>
<body>    <div class="header">
        <h1>🎓 Virtueller Studentenhut</h1>
        <p>Bewegen Sie Ihren Kopf und sehen Sie, wie der Hut realistisch mitfolgt!</p>
    </div>

    <div class="filter-buttons">
        <button class="filter-btn active" onclick="changeFilter('hut.png', this)">🎓 Studentenhut</button>
        <button class="filter-btn" onclick="changeFilter('Rahmen.png', this)">Rahmen</button>
        <button class="filter-btn" onclick="changeFilter('Brille.png', this)">Sonnenbrille</button>
    </div>

    <div class="camera-container">
        <video id="video" autoplay muted playsinline></video>
        <canvas id="canvas"></canvas>
        <div id="loading" class="loading">
            <div class="spinner"></div>
            <div>Kamera wird geladen...</div>
        </div>
    </div>

    <div class="controls">
        <div id="status" class="status">Initialisierung...</div>
    </div>

    <!-- MediaPipe CDN Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>

    <script>
        // DOM-Elemente
        const videoElement = document.getElementById('video');
        const canvasElement = document.getElementById('canvas');
        const canvasCtx = canvasElement.getContext('2d');
        const loadingElement = document.getElementById('loading');
        const statusElement = document.getElementById('status');

        // Canvas-Dimensionen setzen
        canvasElement.width = 640;
        canvasElement.height = 480;        // Filter-Bild laden
        const hatImage = new Image();
        hatImage.src = 'hut.png';
        
        let isHatLoaded = false;
        let isCameraReady = false;
        let isFaceMeshReady = false;
        let currentFilter = 'hut.png';

        // Filter wechseln
        function changeFilter(filterName, buttonElement) {
            currentFilter = filterName;
            hatImage.src = filterName;
            
            // Button-Status aktualisieren
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            buttonElement.classList.add('active');
            
            updateStatus(`Filter gewechselt zu: ${filterName}`);
        }

        // Status-Updates
        function updateStatus(message) {
            statusElement.textContent = message;
        }

        // Prüfen ob alles geladen ist
        function checkIfReady() {
            if (isHatLoaded && isCameraReady && isFaceMeshReady) {
                loadingElement.classList.add('hidden');
                updateStatus('✅ Bereit! Schauen Sie in die Kamera.');
            }
        }

        // Filter-Bild Event-Handler
        hatImage.onload = () => {
            isHatLoaded = true;
            updateStatus('Filter-Bild geladen...');
            checkIfReady();
        };        hatImage.onerror = () => {
            updateStatus(`❌ Fehler: ${currentFilter} konnte nicht geladen werden!`);
        };

        // MediaPipe Face Mesh initialisieren
        const faceMesh = new FaceMesh({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
        });

        // Face Mesh Optionen für optimale Performance und Genauigkeit
        faceMesh.setOptions({
            maxNumFaces: 1,
            refineLandmarks: true,
            minDetectionConfidence: 0.5,
            minTrackingConfidence: 0.5
        });

        // Hilfsfunktion: Winkel zwischen zwei Punkten berechnen
        function calculateAngle(point1, point2) {
            const dx = point2.x - point1.x;
            const dy = point2.y - point1.y;
            return Math.atan2(dy, dx);
        }

        // Hilfsfunktion: Distanz zwischen zwei Punkten berechnen
        function calculateDistance(point1, point2, canvasWidth, canvasHeight) {
            const dx = (point1.x - point2.x) * canvasWidth;
            const dy = (point1.y - point2.y) * canvasHeight;
            return Math.sqrt(dx * dx + dy * dy);
        }

        // Filter-spezifische Konfiguration
        function getFilterConfiguration(filterName, landmarks, canvasWidth, canvasHeight) {
            const forehead = landmarks[10];
            const leftTemple = landmarks[234];
            const rightTemple = landmarks[454];
            const leftEyeCenter = landmarks[468];
            const rightEyeCenter = landmarks[473];
            const chin = landmarks[152];
            const headWidth = calculateDistance(leftTemple, rightTemple, canvasWidth, canvasHeight);
            const headHeight = calculateDistance(forehead, chin, canvasWidth, canvasHeight);
            
            switch (filterName) {
                case 'Brille.png':
                    // Brille: PNG-Unterseite = Augenhöhe, Breite gut, Höhe gestreckt, weitere 5% höher positioniert (insgesamt 15% höher)
                    const eyeCenterY = (leftEyeCenter.y + rightEyeCenter.y) / 2;
                    const glassesAnchorX = (leftEyeCenter.x + rightEyeCenter.x) / 2;
                    // Weitere 5% höher: von der Augenhöhe 15% nach oben verschieben (10% + 5%)
                    const glassesAnchorY = eyeCenterY - (headHeight * 0.15 / canvasHeight);
                    return {
                        anchorPoint: { x: glassesAnchorX, y: glassesAnchorY },
                        width: headWidth * 2.25, // Breite bleibt gut: 50% größer
                        height: headWidth * 2.25 * 0.6, // Höhe gestreckt: 0.4 → 0.6 (50% höher)
                        offsetY: -headWidth * 2.25 * 0.3 // Y-Offset entsprechend angepasst
                    };
                    
                case 'Rahmen.png':
                    // Rahmen: PNG-Unterseite = weitere 5% nach unten (insgesamt 15% unter Kinn)
                    const frameAnchorX = (leftTemple.x + rightTemple.x) / 2;
                    const frameWidth = headWidth * 5.6; // 4x vergrößert: 1.4 * 4 = 5.6
                    const frameHeight = headHeight * 5.2; // 4x vergrößert: 1.3 * 4 = 5.2
                    // Weitere 5% nach unten: chin.y + 15% der Gesichtshöhe
                    const frameAnchorY = chin.y + (headHeight * 0.15 / canvasHeight);
                    return {
                        anchorPoint: { x: frameAnchorX, y: frameAnchorY },
                        width: frameWidth,
                        height: frameHeight,
                        offsetY: -frameHeight,
                        maxDepthFactor: 1.2 // Tiefeneffekt begrenzen
                    };
                    
                case 'hut.png':
                default:
                    // Hut: PNG-Unterseite = Stirnbereich (weitere 10% kleiner)
                    const eyeCenterYHat = (leftEyeCenter.y + rightEyeCenter.y) / 2;
                    const hatAnchorY = forehead.y + (eyeCenterYHat - forehead.y) * 0.38; // 5% tiefer: 0.33 → 0.38
                    const hatAnchorX = (leftTemple.x + rightTemple.x) / 2;
                    const hatWidth = headWidth * 5.346; // 10% kleiner: 5.94 * 0.9 = 5.346
                    return {
                        anchorPoint: { x: hatAnchorX, y: hatAnchorY },
                        width: hatWidth,
                        height: hatWidth * 0.8, // Proportional zur Breite
                        offsetY: -hatWidth * 0.8,
                        maxDepthFactor: 1.0 // Tiefeneffekt stark begrenzen - nicht größer als Kopf
                    };
            }
        }        // Hauptfunktion für Face Mesh Ergebnisse
        faceMesh.onResults((results) => {
            // Canvas leeren 
            canvasCtx.save();
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);

            // Video gespiegelt zeichnen (für natürliche Selfie-Ansicht)
            canvasCtx.translate(canvasElement.width, 0);
            canvasCtx.scale(-1, 1);
            
            // Wichtig: Das Originalvideo-Element verwenden, nicht results.image
            if (videoElement.videoWidth > 0 && videoElement.videoHeight > 0) {
                canvasCtx.drawImage(videoElement, 0, 0, canvasElement.width, canvasElement.height);
            }

            // Gesichtserkennung und Filter-Platzierung
            if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0) {
                const landmarks = results.multiFaceLandmarks[0];                // Wichtige Gesichtspunkte definieren
                const forehead = landmarks[10];          // Stirnmitte (Hauptankerpunkt)
                const leftTemple = landmarks[234];       // Linke Schläfe
                const rightTemple = landmarks[454];      // Rechte Schläfe
                const leftEyeOuter = landmarks[33];      // Äußerer linker Augenwinkel
                const rightEyeOuter = landmarks[263];    // Äußerer rechter Augenwinkel
                const leftEyeCenter = landmarks[468];    // Linkes Augenzentrum
                const rightEyeCenter = landmarks[473];   // Rechtes Augenzentrum
                const noseTip = landmarks[1];            // Nasenspitze
                const chin = landmarks[152];             // Kinn

                // Filter-spezifische Konfiguration abrufen
                const filterConfig = getFilterConfiguration(currentFilter, landmarks, canvasElement.width, canvasElement.height);// 1. Kopfneigung berechnen (für Hut-Rotation)
                const eyeAngle = calculateAngle(leftEyeOuter, rightEyeOuter);
                
                // 2. Vor-/Rückwärts-Neigung des Kopfes berechnen
                const noseToForeheadAngle = calculateAngle(noseTip, forehead);
                const headTiltVertical = noseToForeheadAngle - Math.PI/2; // Normalisiert auf 0 bei gerader Haltung
                
                // 3. Kopfgröße bestimmen (für Hut-Skalierung)
                const headWidth = calculateDistance(leftTemple, rightTemple, canvasElement.width, canvasElement.height);
                const headHeight = calculateDistance(forehead, chin, canvasElement.width, canvasElement.height);                // 4. Filter-Position: Basierend auf Filter-Konfiguration
                const filterCenterX = filterConfig.anchorPoint.x * canvasElement.width;
                const filterCenterY = filterConfig.anchorPoint.y * canvasElement.height;

                // 5. Tiefeneffekt: Filter wird kleiner wenn Kopf weiter weg ist (mit filterspezifischen Limits)
                const baseFactor = Math.max(0.5, Math.min(1.5, headHeight / 200));
                const maxFactor = filterConfig.maxDepthFactor || 1.5; // Standard: 1.5, filterspezifisch begrenzt
                const depthFactor = Math.min(baseFactor, maxFactor);
                const adjustedFilterWidth = filterConfig.width * depthFactor;
                const adjustedFilterHeight = filterConfig.height * depthFactor;                // 6. Filter zeichnen - basierend auf Filter-Konfiguration
                canvasCtx.save();
                
                // Zum Filter-Ankerpunkt verschieben
                canvasCtx.translate(filterCenterX, filterCenterY);
                
                // Horizontale Rotation (Links-/Rechts-Neigung)
                canvasCtx.rotate(eyeAngle);
                
                // Minimale vertikale Perspektive - nur zur visuellen Verbesserung
                const perspectiveScale = 1 + Math.sin(headTiltVertical) * 0.05; // Sehr reduziert
                const verticalSquash = 1 - Math.abs(Math.sin(headTiltVertical)) * 0.1; // Sehr reduziert
                
                canvasCtx.scale(perspectiveScale, verticalSquash);
                
                // Filter zeichnen - der Ankerpunkt ist die Referenz für die Position
                canvasCtx.drawImage(
                    hatImage,
                    -adjustedFilterWidth / 2,
                    filterConfig.offsetY * depthFactor, // Filter-spezifischer Y-Offset
                    adjustedFilterWidth,
                    adjustedFilterHeight
                );
                
                canvasCtx.restore();                // Debug-Information (optional - kann entfernt werden)
                if (false) { // Setzen Sie auf true für Debug-Anzeige
                    canvasCtx.save();
                    canvasCtx.strokeStyle = 'red';
                    canvasCtx.lineWidth = 2;
                    canvasCtx.beginPath();
                    
                    // Wichtige Punkte markieren
                    [forehead, leftTemple, rightTemple, leftEyeOuter, rightEyeOuter].forEach(point => {
                        canvasCtx.arc(point.x * canvasElement.width, point.y * canvasElement.height, 3, 0, 2 * Math.PI);
                    });
                    
                    // Ankerpunkt markieren (grün)
                    canvasCtx.strokeStyle = 'lime';
                    canvasCtx.lineWidth = 3;
                    canvasCtx.arc(hatCenterX, hatCenterY, 5, 0, 2 * Math.PI);
                    
                    canvasCtx.stroke();
                    canvasCtx.restore();
                }

                updateStatus(`✅ Gesicht erkannt - ${currentFilter} platziert (H: ${(eyeAngle * 180 / Math.PI).toFixed(1)}°, V: ${(headTiltVertical * 180 / Math.PI).toFixed(1)}°)`);
            } else {
                updateStatus('🔍 Suche nach Gesicht...');
            }

            canvasCtx.restore();
        });

        // Kamera initialisieren
        async function initializeCamera() {
            try {
                updateStatus('Kamerazugriff wird angefordert...');
                
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: {
                        width: 640,
                        height: 480,
                        facingMode: 'user' // Frontkamera bevorzugen
                    }
                });

                videoElement.srcObject = stream;
                  videoElement.onloadedmetadata = () => {
                    videoElement.play(); // Sicherstellen, dass das Video abgespielt wird
                    isCameraReady = true;
                    updateStatus('Kamera bereit...');
                    checkIfReady();
                    
                    // Warten bis das Video tatsächlich läuft
                    videoElement.onplaying = () => {
                        startProcessing();
                    };
                };

            } catch (error) {
                console.error('Kamera-Fehler:', error);
                updateStatus('❌ Kamerazugriff verweigert oder nicht verfügbar');
                loadingElement.querySelector('div:last-child').textContent = 
                    'Bitte erlauben Sie den Kamerazugriff und laden Sie die Seite neu.';
            }
        }        // Video-Verarbeitung starten
        function startProcessing() {
            if (!isCameraReady || !isFaceMeshReady) return;

            const processFrame = async () => {
                if (videoElement.readyState >= 2 && videoElement.videoWidth > 0) {
                    await faceMesh.send({ image: videoElement });
                }
                requestAnimationFrame(processFrame);
            };

            processFrame();
        }

        // MediaPipe initialisieren (ohne explizites initialize() - das macht Face Mesh automatisch)
        // Face Mesh ist sofort nach der Erstellung bereit
        isFaceMeshReady = true;
        updateStatus('MediaPipe Face Mesh geladen...');
        checkIfReady();

        // Anwendung starten
        window.addEventListener('load', () => {
            initializeCamera();
        });

        // Error-Handler für unerwartete Fehler
        window.addEventListener('error', (event) => {
            console.error('Anwendungsfehler:', event.error);
            updateStatus('❌ Ein unerwarteter Fehler ist aufgetreten');
        });
    </script>
</body>
</html>
